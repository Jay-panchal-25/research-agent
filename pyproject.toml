[project]
name = "research-agent"
version = "0.1.0"
description = "Autonomous Deep Research Agent with WhatsApp integration and executive cited PDF reports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "arq>=0.26",
    "redis>=5.0.1,<6",
    "pymongo>=4.13",
    "litellm>=1.50",
    "qdrant-client>=1.10",
    "ddgs>=9.0",
    "trafilatura>=1.12",
    "lxml_html_clean>=0.1",
    "pymupdf>=1.24",
    "reportlab>=4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
